data:
  # FLARE21 原始数据目录
  # 图像目录：包含 train_XXX_0000.nii.gz 格式的文件
  img_root: /home/dengzhipeng/data/brain_processed/flare21/TrainingImg
  # 标签目录：包含 train_XXX.nii.gz 格式的文件
  mask_root: /home/dengzhipeng/data/brain_processed/flare21/TrainingMask
  # 预处理结果保存目录
  preproc_root: /home/dengzhipeng/data/brain_processed/flare21

  # 标签重映射规则（原始→目标）
  # FLARE21 原始标签: 0=background, 1=liver, 2=kidney, 3=spleen, 4=pancreas


  # 标签重映射规则（原始→目标），KiTS19: 0=background, 1=kidney, 2=tumor
  label_remap:
    0: 0
    1: 1
    2: 2
    3: 3
    4: 4

  # ========== 重采样配置 ==========
  # 重采样模式: "shape" (固定尺寸) 或 "spacing" (基于spacing，参考nnU-Net/motokimura)
  resample_mode: shape

  # 当 resample_mode=shape 时使用: 目标体素尺寸（H, W, D）
  target_shape: [160, 160, 160]

  # 当 resample_mode=spacing 时使用: 目标spacing (参考 motokimura/kits19_3d_segmentation)
  # target_spacing: [3.22, 1.62, 1.62]

  # 排除的案例编号（参考仓库排除了一些有问题的案例）
  # exclude_cases: [15, 23, 37, 68, 125, 133]

  # ========== 归一化配置 ==========
  # 归一化模式:
  #   - "zscore": 原方式，per-case z-score（与BraTS19一致）
  #   - "ct_window": CT窗宽窗位
  #   - "nnunet": nnU-Net风格（推荐），分位数clip + 全局均值/标准差
  norm_mode: nnunet

  # 当 norm_mode=zscore 时使用: z-score 后的截断阈值 |z|<=z_clip
  z_clip: 5.0

  # 当 norm_mode=ct_window 时使用: 窗宽窗位参数
  # 软组织窗 (适合观察肾脏/肿瘤): WL=40-50, WW=350-400
  window_center: 50.0   # 窗位 (Window Level), HU
  window_width: 400.0   # 窗宽 (Window Width), HU
  # 对应HU范围: [-150, 250]

  # 是否把归一化后的值映射到 [0,1]（nnunet模式不使用此参数）
  to_01: true

  # train / val / test 划分比例（会自动归一化，不必严格相加为 1）
  split_ratio: [0.7, 0.15, 0.15]

  # 随机种子，控制划分稳定
  split_seed: 42

  run_preprocess: true