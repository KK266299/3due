data:
  # KiTS19 原始数据根目录，下面有 case_00000 ~ case_00209 子目录
  raw_root: /home/dengzhipeng/data/kits19/data

  # 预处理结果保存目录
  preproc_root: /home/dengzhipeng/data/brain_processed/kits19

  # 通道顺序（KiTS19 只有单通道 CT，按文件名关键词匹配）
  modalities: [imaging]

  # 标签重映射规则（原始→目标），KiTS19: 0=background, 1=kidney, 2=tumor
  label_remap:
    0: 0
    1: 1
    2: 2

  # 目标体素尺寸（H, W, D），统一 resize 到该大小
  target_shape: [160, 160, 160]

  # z-score 后的截断阈值 |z|<=z_clip
  z_clip: 5.0

  # 是否把 clip 后的 z-score 映射到 [0,1]
  to_01: true

  # train / val / test 划分比例（会自动归一化，不必严格相加为 1）
  split_ratio: [0.7, 0.15, 0.15]

  # 随机种子，控制划分稳定
  split_seed: 42

  run_preprocess: true