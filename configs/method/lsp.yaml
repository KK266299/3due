# @package _global_
# ============================================================================
# LSP (Linear Separable Perturbation) - Training-Free Configuration
# ============================================================================
#
# Based on "Availability Attacks Create Shortcuts" method:
# - Generates linearly separable noise patterns without training
# - For Medical Image Segmentation: Uses ROI-based binary classification
#
# Standard LSP: For general classification/ReID tasks
# ROI-based LSP (roi_mode=binary): For Medical Image Segmentation (MIS)
#   - Generates TWO linearly separable noise patterns per sample
#   - Blends background and foreground noise based on segmentation mask
#   - "To adapt LSP for MIS tasks, we treat pixels inside and outside
#     the ROI as two distinct classes"
#
# Usage:
#   python ue_generate.py \
#     dataset=brats19 \
#     task.run_name=lsp_noise \
#     method=lsp \
#     task=brats19_ue \
#     ue.key.type=samplewise \
#     ue.key.from=field \
#     ue.key.field=case_id
# ============================================================================

training:
  model_save_start: 9999
  epochs: 1  # Training-free: no training needed
  batch_size: 8
  data:
    transforms:
      forbid_geom_aug: true
      normalize: false
      pixel_aug: false
    poison:
      enabled: false  # No poisoning during generation

ue:
  store_dir: ${task.save_dir}/${task.run_name}/${now:%Y%m%d_%H%M%S}/ue/lsp

  # Key specification for mapping samples to noise
  key:
    type: samplewise
    from: field
    field: case_id

  # Algorithm configuration - Training-Free LSP
  algorithm:
    kind: training_free
    name: lsp
    params:
      image_size: ${training.data.transforms.image_size}
      epsilon: 0.0313725       # 8/255, L-infinity bound
      seed: 0                  # Random seed for reproducibility
      noise_frame_size: 32     # Patch size (8 or 32)
      class_sep: 10.0          # Class separation in make_classification
      roi_mode: binary         # "binary" for MIS, null for standard
      num_labels: 4            # Number of segmentation classes (BraTS: 4)

  # Export configuration (same as minmin)
  io:
    enabled: true
    include_manifest: true
    strategy: files            # "files" or "shards"
    dtype: int8                # Quantize to int8 for storage