# @package _global_
# SEP (Self-Ensemble Protection) for BraTS19 3D Segmentation
# Based on: "Self-ensemble protection: Training checkpoints are good data protectors"
#
# Key differences from min_min:
#   - Uses multiple pre-trained checkpoints as ensemble
#   - Training-free: surrogate_step is a no-op
#   - Noise generated by minimizing ensemble-averaged DiceCE loss

training:
  model_save_start: 9999 # no need to save for SEP
  model_save_freq: 10
  epochs: 3
  batch_size: 64
  num_workers: 0
  sampler:
    name: pk
    p: 32  # every batch 32 different patients
    k: 2   # each patient 2 images
  data:
    poison:
      enabled: false
    transforms:
      geom_aug: false
      intensity_aug: false
      normalize: false

ue:
  store_dir: ${task.save_dir}/${task.run_name}/${now:%Y%m%d_%H%M%S}/noise

  key:
    type: samplewise
    from: field
    field: case_id

  algorithm:
    kind: training_based    # SEP uses training_based pipeline but surrogate_step is no-op
    name: sep
    params:
      epsilon: 0.0313725        # 8/255
      noise_step: 10            # T: outer protection iterations
      svrg_M: 5                 # M: inner SVRG iterations
      step_size: 0.0039215      # 1/255
      surrogate_step: 1         # minimal value since surrogate_step is no-op (training-free)

  eot:
    enabled: false
    n: 3
    geom_aug: true
    pix_aug: true
    same_on_batch: false

  # SEP checkpoint paths - should be set via command line or override
  # Example: ue.sep.ckpt_paths=[path1.pth,path2.pth,path3.pth]
  sep:
    ckpt_paths: []   # List of checkpoint paths for ensemble

  surrogates:
    s_seg:
      backbone: unet
      in_channels: 4
      num_classes: 4
      spatial_dims: 3
      channels: [32, 64, 128, 256, 512]
      strides: [2, 2, 2, 2]
      num_res_units: 2
      norm: "INSTANCE"
      act: "RELU"
      dropout: 0.0
      optimizer: { name: adam, lr: 5e-4, weight_decay: 5e-4, betas: [0.9, 0.9999], eps: 1.0e-8 }
      # Checkpoint paths for ensemble (alternative location)
      # ckpt_paths:
      #   - /path/to/checkpoint_epoch_10.pth
      #   - /path/to/checkpoint_epoch_20.pth
      #   - /path/to/checkpoint_epoch_30.pth

  io:
    enabled: true
    include_manifest: true
    strategy: files
    dtype: int8
    save_from_epoch: 0
    save_every: 10