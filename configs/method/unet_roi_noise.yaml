# @package _global_
# UNet-based ROI Noise Generator Configuration
# Noise is only applied to ROI (tumor) regions
# Usage: python ue_generate.py method=unet_roi_noise ...

training:
  model_save_start: 9999  # No model saving for noise generation
  model_save_freq: 10
  epochs: 100
  batch_size: 8
  num_workers: 2
  sampler:
    name: pk
    p: 32
    k: 2
  data:
    poison:
      enabled: false
    transforms:
      geom_aug: false
      intensity_aug: false
      normalize: false

ue:
  store_dir: ${task.save_dir}/${task.run_name}/${now:%Y%m%d_%H%M%S}/noise

  key:
    type: samplewise
    from: field
    field: case_id

  algorithm:
    kind: training_based
    name: unet_roi_noise
    params:
      epsilon: 0.0313725        # 8/255 - L_inf bound
      noise_step: 1             # Generator update steps per batch
      step_size: 0.0039215      # Not used by UNet (kept for compatibility)
      surrogate_step: 20        # S-step batches per epoch
      roi_threshold: 0          # ROI = (label > roi_threshold)
                                # 0 means any non-background pixel

  # UNet ROI Noise Generator Configuration
  noise_generator:
    in_channels: 4              # BraTS19: 4 MRI modalities
    spatial_dims: 3             # 3D volumes
    channels: [16, 32, 64, 128] # Lightweight generator
    strides: [2, 2, 2]
    num_res_units: 2
    norm: "INSTANCE"
    act: "LEAKYRELU"
    dropout: 0.0
    optimizer:
      name: adam
      lr: 1e-4
      weight_decay: 0.0
      betas: [0.9, 0.999]

  eot:
    enabled: false
    n: 3
    geom_aug: true
    pix_aug: true
    same_on_batch: false

  # Surrogate model (same as min_min)
  surrogates:
    s_seg:
      backbone: unet
      in_channels: 4
      num_classes: 4
      spatial_dims: 3
      channels: [32, 64, 128, 256, 512]
      strides: [2, 2, 2, 2]
      num_res_units: 2
      norm: "INSTANCE"
      act: "RELU"
      dropout: 0.0
      optimizer:
        name: adam
        lr: 5e-4
        weight_decay: 5e-4
        betas: [0.9, 0.9999]
        eps: 1.0e-8

  io:
    enabled: true
    include_manifest: true
    strategy: files
    dtype: int8
    save_from_epoch: 0
    save_every: 10