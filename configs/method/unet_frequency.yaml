# @package _global_
# Spectrally-coherent UE configuration (frequency-domain masking)

training:
  model_save_start: 9999 # no need to save for minmin-style UE
  model_save_freq: 10
  epochs: 100
  batch_size: 8
  num_workers: 0
  sampler:
    name: pk
    p: 4
    k: 2
  data:
    poison:
      enabled: false
    transforms:
      geom_aug: false
      intensity_aug: false
      normalize: false

ue:
  store_dir: ${task.save_dir}/${task.run_name}/${now:%Y%m%d_%H%M%S}/noise

  key:
    type: samplewise
    from: field
    field: case_id

  algorithm:
    kind: training_based
    name: unet_frequency
    params:
      epsilon: 0.0156863        # 4/255 L_inf bound (max)
      noise_step: 10
      step_size: 0.0039215      # 1/255
      surrogate_step: 10
      spectral_mask:
        z_max: 0.125            # low-frequency along z
        xy_min: 0.05            # in-plane band-pass low cutoff
        xy_max: 0.35            # in-plane band-pass high cutoff
      roi_gate:
        enabled: false
        smooth_sigma: 0.0

  eot:
    enabled: false
    n: 3
    geom_aug: true
    pix_aug: true
    same_on_batch: false

  surrogates:
    s_seg:
      backbone: unet
      in_channels: 4
      num_classes: 4
      spatial_dims: 3
      channels: [32, 64, 128, 256, 512]
      strides: [2, 2, 2, 2]
      num_res_units: 2
      norm: "INSTANCE"
      act: "RELU"
      dropout: 0.0
      optimizer: { name: adam, lr: 5e-4, weight_decay: 5e-4, betas: [0.9, 0.9999], eps: 1.0e-8 }

  io:
    enabled: true
    include_manifest: true
    strategy: files
    dtype: int8
    save_from_epoch: 0
    save_every: 10
