# @package _global_
# PUE (Provably Unlearnable Examples) for BraTS19 3D Segmentation
# Based on: "Provably Unlearnable Data Examples" (NDSS 2025)
# Authors: Derui Wang, Minhui Xue, Bo Li, Seyit Camtepe, Liming Zhu
# Paper: https://www.ndss-symposium.org/ndss-paper/provably-unlearnable-data-examples/
# PDF: https://www.ndss-symposium.org/wp-content/uploads/2025-886-paper.pdf
# Code: https://github.com/NeuralSec/certified-data-learnability
#
# Key differences from min_min:
#   - Uses Random Weight Perturbation (RWP) for robust noise generation
#   - Surrogate training with weight noise sampling (U_train times)
#   - Noise optimization with weight noise sampling (U_noise times)
#   - Provides (q, η)-Learnability certification guarantees

training:
  model_save_start: 9999 # no need to save for PUE
  model_save_freq: 10
  epochs: 100
  batch_size: 64
  num_workers: 2
  sampler:
    name: pk
    p: 32  # every batch 32 different patients
    k: 2   # each patient 2 images
  data:
    poison:
      enabled: false
    transforms:
      geom_aug: false
      intensity_aug: false
      normalize: false

ue:
  store_dir: ${task.save_dir}/${task.run_name}/${now:%Y%m%d_%H%M%S}/noise

  key:
    type: samplewise
    from: field
    field: case_id

  # —— Random Weight Perturbation (RWP) Configuration ——
  # 论文核心：通过对模型权重添加随机高斯噪声，使生成的噪声更加鲁棒
  # 原论文 (2D CIFAR): sigma=0.25, U_p=10
  # 3D 医学分割适配：sigma 适当降低（网络更大更敏感），U 降低（每次采样开销大）
  rwp:
    enabled: true               # 启用 RWP（论文主方法）
    sigma: 0.1                  # 对每个可训练参数加 N(0, σ²) 临时噪声（论文0.25, 3D适配0.1）
    U_train: 4                  # surrogate_step 内每步采样次数（论文10, 3D适配4）
    U_noise: 8                  # noise_step 内每步采样次数（论文10, 3D适配8）

  # —— AMP (Mixed Precision) ——
  # 对 3D UNet 有显著加速（~2x），推荐在 GPU 上始终开启
  amp:
    enabled: false              # 命令行可用 ue.amp.enabled=true 覆盖

  algorithm:
    kind: training_based
    name: pue
    params:
      epsilon: 0.0313725        # 8/255 (ℓ∞ 半径)
      noise_step: 10            # N-step 内层 PGD 步数（3D 建议 1-3，默认 10 来自 2D 论文）
      step_size: 0.0039215      # 1/255
      surrogate_step: 20        # S-step 每 epoch 多少个 batch

  eot:
    enabled: false
    n: 3                        # 2~4 起步
    geom_aug: true
    pix_aug: true
    same_on_batch: false        # true = 整个 batch 用同一随机参数

  surrogates:
    s_seg:
      backbone: unet
      in_channels: 4
      num_classes: 4
      spatial_dims: 3
      channels: [32, 64, 128, 256, 512]
      strides: [2, 2, 2, 2]
      num_res_units: 2
      norm: "INSTANCE"
      act: "RELU"
      dropout: 0.0
      optimizer: { name: adam, lr: 5e-4, weight_decay: 5e-4, betas: [0.9, 0.9999], eps: 1.0e-8 }

  io:
    enabled: true
    include_manifest: true
    strategy: files
    dtype: int8
    save_from_epoch: 50
    save_every: 10