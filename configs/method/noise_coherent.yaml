# @package _global_
# Noise Coherent: Learnable P (Complex Spectral Parameters) with UNet Update
#
# 核心思想:
#   - 维护可学习的 P 参数（频域，实部和虚部）
#   - 应用频域 mask，IFFT 到空域
#   - tanh + epsilon 限制扰动范围
#   - 可选的 ROI 软边缘 mask
#   - 最小化 surrogate 在扰动图像上的分割损失（min-min）
#
# 使用方法:
#   python ue_generate.py \
#     dataset=flare21 \
#     task.run_name=noise_coherent_4_255 \
#     method=noise_coherent \
#     task=flare21_ue \
#     training.epochs=100 \
#     ue.key.type=samplewise \
#     ue.key.from=field \
#     ue.key.field=case_id \
#     training.batch_size=8 \
#     training.gpu_ids=[0] \
#     ue.algorithm.params.epsilon=0.0156863 \
#     ue.algorithm.params.surrogate_step=10 \
#     ue.io.save_from_epoch=50 \
#     ue.io.save_every=10

training:
  model_save_start: 9999  # 不需要保存模型
  model_save_freq: 10
  epochs: 100
  batch_size: 8
  num_workers: 0
  sampler:
    name: pk
    p: 4   # 每个batch 4个不同的patient
    k: 2   # 每个patient 2张图像
  data:
    poison:
      enabled: false
    transforms:
      geom_aug: false
      intensity_aug: false
      normalize: false

ue:
  store_dir: ${task.save_dir}/${task.run_name}/${now:%Y%m%d_%H%M%S}/noise

  key:
    type: samplewise
    from: field
    field: case_id

  algorithm:
    kind: training_based
    name: noise_coherent
    params:
      epsilon: 0.0313725       # 8/255 = 0.0313725, 4/255 = 0.0156863
      noise_step: 1            # P 训练迭代次数 per batch
      surrogate_step: 2        # S-step: 每个 epoch 更新 surrogate 的 batch 数

      # === P 参数初始化 ===
      p_init:
        init_method: "spectral_masked"  # "spatial": 空域→FFT; "spectral": 频域→IFFT; "spectral_masked": 频域mask内初始化（推荐）
        init_scale: 10.0                # 初始化尺度（用于 spectral 和 spectral_masked 方法）

      # === 频域 Mask 参数 ===
      spectral_mask:
        z_max: 0.125           # Z 轴（层间）低频截止
        xy_min: 0.05           # XY 平面（层内）带通下限
        xy_max: 0.3            # XY 平面（层内）带通上限

      # === ROI 软边缘 ===
      roi_gate:
        enabled: false         # 启用/禁用 ROI 软边缘（false = 硬边缘）
        dilate_kernel_size: 3  # ROI 膨胀卷积核
        gaussian_sigma: 2.0    # 高斯平滑 sigma（控制边缘软化程度）

      # === 优化器（针对 P） ===
      optimizer:
        lr: 1.0e-3             # 学习率
        weight_decay: 1.0e-5   # 权重衰减
        betas: [0.9, 0.999]    # Adam betas

  eot:
    enabled: false
    n: 3
    geom_aug: true
    pix_aug: true
    same_on_batch: false

  surrogates:
    s_seg:
      backbone: unet
      in_channels: 4           # 根据数据集修改
      num_classes: 4           # 根据数据集修改
      spatial_dims: 3
      channels: [32, 64, 128, 256, 512]
      strides: [2, 2, 2, 2]
      num_res_units: 2
      norm: "INSTANCE"
      act: "RELU"
      dropout: 0.0
      optimizer: { name: adam, lr: 5.0e-4, weight_decay: 5.0e-4, betas: [0.9, 0.9999], eps: 1.0e-8 }

  io:
    enabled: true
    include_manifest: true
    strategy: files
    dtype: int8
    save_from_epoch: 0         # 从 epoch 0 开始保存
    save_every: 10             # 每 10 个 epoch 保存一次