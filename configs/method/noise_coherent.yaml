# @package _global_
# Noise Coherent: UNet-based Samplewise Complex P Optimization for 3D Segmentation UE
#
# 本方法与 unet_roi_noise.py 流程一致，核心区别:
#   - unet_roi_noise: delta = tanh(UNet(x)) * ε（直接输出空域噪声）
#   - noise_coherent: delta = tanh(IFFT(P * M)) * ε，其中 P = UNet(x)（输出频域参数）
#
# Samplewise 特性:
#   - 每个样本有自己的 P: P = UNet(x)
#   - 不同的 x 产生不同的 P，因此 P 是 samplewise 的
#
# P 的初始化:
#   - P 由 UNet 直接从输入图像 x 生成: P = UNet(x)
#   - UNet 权重使用 MONAI 默认初始化（Kaiming）
#   - 初始时 P 接近零（因为 UNet 输出层偏置初始化为 0）
#   - 训练过程中，通过更新 UNet 权重来更新每个样本的 P
#
# 软边缘梯度回传:
#   - soft_edge=false: 硬边缘(0/1)，与 unet_roi_noise 一致
#   - soft_edge=true: 软边缘(高斯平滑)，边缘区域梯度平滑衰减
#
# 使用方法:
#   python ue_generate.py \
#     dataset=flare21 \
#     task=flare21_ue \
#     task.run_name=noise_coherent_4_255_hard \
#     method=noise_coherent \
#     training.epochs=100 \
#     training.batch_size=8 \
#     training.gpu_ids=[0] \
#     ue.key.type=samplewise \
#     ue.key.from=field \
#     ue.key.field=case_id \
#     ue.algorithm.params.epsilon=0.0156863 \
#     ue.algorithm.params.noise_step=1 \
#     ue.algorithm.params.surrogate_step=10 \
#     ue.algorithm.params.roi_aware=true \
#     ue.algorithm.params.soft_edge=false \
#     ue.io.save_from_epoch=50 \
#     ue.io.save_every=10 \
#     ue.surrogates.s_seg.in_channels=1 \
#     ue.surrogates.s_seg.num_classes=5

training:
  model_save_start: 9999  # 不需要保存模型
  model_save_freq: 10
  epochs: 100
  batch_size: 8
  num_workers: 0
  sampler:
    name: pk
    p: 4   # 每个batch 4个不同的patient
    k: 2   # 每个patient 2张图像
  data:
    poison:
      enabled: false
    transforms:
      geom_aug: false
      intensity_aug: false
      normalize: false

ue:
  store_dir: ${task.save_dir}/${task.run_name}/${now:%Y%m%d_%H%M%S}/noise

  key:
    type: samplewise
    from: field
    field: case_id

  algorithm:
    kind: training_based
    name: noise_coherent
    params:
      epsilon: 0.0313725       # 8/255 = 0.0313725, 4/255 = 0.0156863
      noise_step: 1            # P-UNet 训练迭代次数 per batch
      surrogate_step: 2        # S-step: 每个 epoch 更新 surrogate 的 batch 数

      # === ROI 配置 ===
      roi_aware: true          # 是否启用 ROI mask
      soft_edge: false         # 软边缘开关: false=硬边缘(0/1), true=软边缘(高斯平滑)
      dilate_kernel_size: 3    # ROI 膨胀卷积核（仅 soft_edge=true）
      gaussian_sigma: 2.0      # 高斯平滑 sigma（仅 soft_edge=true）

      # === 频域 Mask 参数 ===
      spectral_mask:
        z_lowpass: true        # true=Z轴低通(层间一致), false=Z轴高通(层间差异大)
        z_cutoff: 0.125        # Z 轴截止频率
        xy_min: 0.05           # XY 平面（层内）带通下限
        xy_max: 0.3            # XY 平面（层内）带通上限

  # === P-UNet 配置 ===
  # P-UNet 接收图像 x，输出 P 的实部和虚部 [B, 2*C, D, H, W]
  # 每个样本通过 UNet(x) 得到自己独特的 P（samplewise）
  # P 初始化: UNet 权重使用 Kaiming 初始化，初始 P 接近零
  p_unet:
    channels: [16, 32, 64, 128]
    strides: [2, 2, 2]
    num_res_units: 1
    act: LEAKYRELU
    norm: INSTANCE
    dropout: 0.0
    optimizer:
      lr: 1.0e-4             # P-UNet 学习率
      weight_decay: 1.0e-5   # 权重衰减
      betas: [0.9, 0.999]    # Adam betas

  eot:
    enabled: false
    n: 3
    geom_aug: true
    pix_aug: true
    same_on_batch: false

  surrogates:
    s_seg:
      backbone: unet
      in_channels: 4           # 根据数据集修改
      num_classes: 4           # 根据数据集修改
      spatial_dims: 3
      channels: [32, 64, 128, 256, 512]
      strides: [2, 2, 2, 2]
      num_res_units: 2
      norm: "INSTANCE"
      act: "RELU"
      dropout: 0.0
      optimizer: { name: adam, lr: 5.0e-4, weight_decay: 5.0e-4, betas: [0.9, 0.9999], eps: 1.0e-8 }

  io:
    enabled: true
    include_manifest: true
    strategy: files
    dtype: int8
    save_from_epoch: 0         # 从 epoch 0 开始保存
    save_every: 10             # 每 10 个 epoch 保存一次